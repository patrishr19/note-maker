<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/css/output.css" rel="stylesheet">
</head>
<body>
  <nav class="relative bg-gray-900">
        <div class="mx-auto px-2 sm:px-6 lg:px-8">
            <div class="relative flex items-center justify-between h-16">
                <div class="flex absolute left-0 items-center inset-y-0 sm:hidden">
                    <!-- Mobile stuff -->
                </div>
                <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
                    <div class="flex shrink-0 items-center">
                        <span class="font-sans font-medium text-white text-lg1 w-auto select-none">Note Maker</span>
                    </div>
                    <div class="hidden sm:ml-6 sm:block">
                        <div class="flex space-x-4">
                            <a href="#" class="font-sans rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">Home</a>
                            <a href="#" class="font-sans rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">Pinned</a>
                            <a href="#" class="font-sans rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">Archive</a>
                        </div>
                    </div>
                </div>
                <div class="text-white absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:ml-6 sm:pr-0">
                    <button type="button" class="relative rounded-full p-1 text-gray-400 cursor-pointer hover:text-white focus:outline-none">
                        <span class="absolute -inset-1 5"></span>
                        <span class="sr-only">Notifications</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"></path></svg>
                    </button>

                    <div class="relative ml-3">
                        <button class="relative flex rounded-full cursor-pointer">
                            <span class="absolute -inset-1.5"></span>
                            <span class="sr-only"></span>
                            <img src="https://i.ibb.co/tw4whtRs/phil-Mahar.jpg" alt="Profile Picture" class="size-8 rounded-full bg-gray-800 ">
                        </button>

                        <div anchor="bottom end" popover class="w-48 origin-top-right rounded-md bg-gray-800 py-1 outline -outline-offset-1 outline-white/10 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in">
                            <a href="#" class="block px-4 py-2 text-sm font-sanss text-gray-300 hover:text-gray-100">Your profile</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </nav>
</body>
</html>
